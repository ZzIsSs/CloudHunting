# render.yaml — Cau hinh Render.com Blueprint
# File nay giup Render tu dong setup service khi connect repo

services:
  - type: web
    name: cloudhunting
    runtime: python
    buildCommand: bash render_build.sh
    startCommand: bash render_start.sh
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MOCK_AUTH
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NODE_VERSION
        value: "22.13.0"
